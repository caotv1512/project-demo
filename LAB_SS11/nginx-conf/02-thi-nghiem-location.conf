# /etc/nginx/conf.d/quickbite.conf  —  BAI 2: thi nghiem quy tac so khop location
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/quickbite_access.log;

    location = /chinh-xac  { default_type text/plain; return 200 "1. = chinh xac\n"; }
    location ^~ /uu-tien/  { default_type text/plain; return 200 "2. ^~ tien to uu tien\n"; }
    location ~* \.json$    { default_type text/plain; return 200 "3. ~* regex\n"; }
    location /uu-tien      { default_type text/plain; return 200 "4. tien to thuong\n"; }

    # Xem Nginx tinh ra gia tri gi cho tung bien
    location = /debug {
        default_type text/plain;
        return 200 "Host=$host\nX-Real-IP=$remote_addr\nX-Forwarded-For=$proxy_add_x_forwarded_for\nX-Forwarded-Proto=$scheme\nURI=$request_uri\n";
    }

    location /api/ {
        proxy_pass http://quickbite5-gateway:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
