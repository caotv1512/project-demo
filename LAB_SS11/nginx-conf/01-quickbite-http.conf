# /etc/nginx/conf.d/quickbite.conf  —  BAI 3: reverse proxy co ban
server {
    listen 80;
    server_name _;                      # khop moi request di vao IP cua VPS

    access_log /var/log/nginx/quickbite_access.log;
    error_log  /var/log/nginx/quickbite_error.log;

    location /api/ {
        # TREN VPS THAT:  proxy_pass http://127.0.0.1:8080;
        # TRONG SANDBOX:  goi theo ten container tren mang Docker
        proxy_pass http://quickbite5-gateway:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
