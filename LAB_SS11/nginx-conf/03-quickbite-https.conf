# /etc/nginx/conf.d/quickbite.conf  —  BAI 4: SSL termination + chuyen huong 301
#
# Day chinh la hinh dang file sau khi Certbot sua tren VPS that.
# Khac biet duy nhat: duong dan chung chi tro toi /etc/letsencrypt/live/<ten-mien>/

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;      # cong 80 CHI lam mot viec
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/quickbite.crt;
    ssl_certificate_key /etc/nginx/ssl/quickbite.key;

    access_log /var/log/nginx/quickbite_access.log;
    error_log  /var/log/nginx/quickbite_error.log;

    location /api/ {
        proxy_pass http://quickbite5-gateway:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
