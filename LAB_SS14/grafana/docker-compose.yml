services:

  grafana:
    image: grafana/grafana:10.0.3
    container_name: quickbite-grafana
    ports:
      # Cong tren MAY BAN co the doi neu 3000 da bi chiem: GRAFANA_HOST_PORT=3001
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-quickbite_lab_2026}
    networks:
      - quickbite5-net
    restart: unless-stopped

volumes:
  grafana-data:

networks:
  quickbite5-net:
    external: true        # mang do Session 05 tao ra, Session 13 dung chung
