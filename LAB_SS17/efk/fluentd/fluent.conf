# ==========================================================================
#  fluent.conf - ba khoi: nhan log, parse JSON, ghi vao Elasticsearch
# ==========================================================================

# 1. NHAN LOG tu Docker logging driver
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# 2. PARSE truong "log" (chuoi JSON do Spring Boot in ra)
<filter quickbite.**>
  @type parser
  key_name log
  reserve_data true           # giu lai container_name, source cua Docker
  remove_key_name_field true  # BO truong "log" goc sau khi parse
                              # Khong bo -> Elasticsearch tu choi document:
                              # "log" vua la text (chuoi goc) vua la object
                              # (log.level, log.logger) -> xung dot mapping.
  <parse>
    @type json
  </parse>
</filter>

# 2b. DON dong KHONG phai JSON (banner khoi dong, canh bao cua JVM).
#     Parser khong doc duoc chung nen giu nguyen truong "log" dang chuoi.
#     Mot document nhu vay tao mapping "log" kieu text, va tu do moi
#     document co log.level / log.logger deu bi Elasticsearch tu choi.
<filter quickbite.**>
  @type record_transformer
  enable_ruby true
  remove_keys log
  <record>
    message ${record["message"] || record["log"]}
  </record>
</filter>

# 3. GHI vao Elasticsearch, co buffer tren dia
<match quickbite.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix quickbite
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key fluentd_tag
  suppress_type_name true
  log_es_400_reason true       # in ly do that su khi Elasticsearch tra 400
  <buffer>
    @type file
    path /fluentd/buffer/quickbite
    flush_mode interval
    flush_interval 5s
    retry_forever true
    chunk_limit_size 8m
    total_limit_size 512m
  </buffer>
</match>

# Log noi bo cua chinh Fluentd -> chi in ra stdout, khong gui sang Elasticsearch
<label @FLUENT_LOG>
  <match **>
    @type stdout
  </match>
</label>

# Tag khong bat dau bang quickbite. -> in ra stdout de debug
<match **>
  @type stdout
</match>
